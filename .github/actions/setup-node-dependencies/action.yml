name: Set up Node.js dependencies
description: Restore an exact dependency tree or install it from the lockfile

inputs:
  node-version:
    description: Exact Node.js version used by the job
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    # setup-node's npm cache avoids downloading package tarballs again, but
    # npm ci must still reconstruct every package. Cache the exact installed
    # tree as well; deliberately omit restore-keys so a stale partial match is
    # never treated as a valid dependency installation.
    - name: Restore installed dependencies
      id: installed-dependencies
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        key: >-
          node-modules-v1-${{ runner.os }}-${{ runner.arch }}-node-${{ inputs.node-version }}-${{ hashFiles('package.json', 'package-lock.json', '.npmrc') }}

    - name: Install dependencies from lockfile
      if: steps.installed-dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci --no-audit
