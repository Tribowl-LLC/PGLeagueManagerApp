# See docs/ci.md for the dependency-security and action-pinning workflow.

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Keep runtime updates grouped by ownership and blast radius. Major
    # updates intentionally remain ungrouped so framework migrations arrive
    # as individual PRs instead of being bundled into a broken batch.
    groups:
      npm-production-capacitor:
        patterns:
          - "@capacitor/*"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-production-observability:
        patterns:
          - "@sentry/*"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-production-ui:
        patterns:
          - "@radix-ui/*"
          - "class-variance-authority"
          - "react-icons"
          - "wouter"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-production-forms-query:
        patterns:
          - "@tanstack/react-query"
          - "react-hook-form"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-production-schema:
        patterns:
          - "drizzle-zod"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-production-runtime:
        patterns:
          - "express-rate-limit"
          - "helmet"
          - "nanoid"
          - "sanitize-html"
          - "square"
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
      npm-development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    # `/` covers everything under .github/workflows/.
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
