name: Semgrep

# Diff-aware scans run for pull requests. The weekly schedule and manual runs
# scan main in full. Exact-main certification proves a pushed tree is identical
# to the successfully scanned pull request tree.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

concurrency:
  group: semgrep-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # GitHub does not expose repository secrets to Dependabot PRs. The
    # normal CI and scheduled scans still run; this avoids a misleading
    # token-authentication failure on a Dependabot-generated PR.
    if: github.actor != 'dependabot[bot]'

    container:
      # Linux/amd64 digest for the Semgrep image used by this workflow.
      image: semgrep/semgrep@sha256:525beaba156b9bd3f9847d6ec0eb8f308e11f407e0c0b2da641e7c8dd99c97d6

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Semgrep CI
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: semgrep ci
