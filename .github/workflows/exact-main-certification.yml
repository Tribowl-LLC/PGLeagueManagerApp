name: Exact main certification

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: exact-main-certification-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  certify:
    name: Exact main certification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove exact checkout and clean worktree
        env:
          CERTIFIED_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$CERTIFIED_SHA"
          git diff --quiet
          git diff --cached --quiet
          test -z "$(git status --short)"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.22.0'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Trace main tree to successful merge-result validation
        env:
          CERTIFIED_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: npx tsx scripts/verify-exact-main-provenance.ts

      - name: Verify exact migration bytes and metadata
        run: |
          npm run db:migration-bytes:check
          clone="$RUNNER_TEMP/leaguevault-main-migration-bytes"
          git clone --quiet --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$clone"
          git -C "$clone" config core.autocrlf true
          git -C "$clone" checkout --quiet --detach "$GITHUB_SHA"
          (
            cd "$clone"
            "$GITHUB_WORKSPACE/node_modules/.bin/tsx" scripts/check-migration-bytes.ts
          )

      - name: Build the production application
        run: npm run build
