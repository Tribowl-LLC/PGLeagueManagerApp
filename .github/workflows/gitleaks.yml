name: Gitleaks

# Pull requests scan their new commits. Weekly and manual runs scan the complete
# repository history for older leaks. Exact-main certification proves the
# pushed tree is identical to the successfully scanned pull request tree.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

concurrency:
  group: gitleaks-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --no-color --exit-code 1 \
            --log-opts="$GITLEAKS_BASE_SHA..$GITLEAKS_HEAD_SHA" /repo

      - name: Scan full repository history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --no-color --exit-code 1 /repo
