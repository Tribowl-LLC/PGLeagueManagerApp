name: Gitleaks

# Pull requests and pushes scan only their new commits. Weekly and manual runs
# scan the complete repository history for older leaks.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '41 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITLEAKS_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --no-color --exit-code 1 \
            --log-opts="$GITLEAKS_BASE_SHA..$GITLEAKS_HEAD_SHA" /repo

      - name: Scan pushed commits
        if: github.event_name == 'push'
        env:
          GITLEAKS_BEFORE_SHA: ${{ github.event.before }}
          GITLEAKS_AFTER_SHA: ${{ github.sha }}
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --no-color --exit-code 1 \
            --log-opts="$GITLEAKS_BEFORE_SHA..$GITLEAKS_AFTER_SHA" /repo

      - name: Scan full repository history
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            git --redact --no-banner --no-color --exit-code 1 /repo
