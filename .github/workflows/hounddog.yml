name: HoundDog privacy scan

# HoundDog checks sensitive-data flows into logs, files, APIs, and
# third-party integrations. This workflow uses the free local scanner mode:
# results are printed in the job log and are not uploaded to HoundDog Cloud.
on:
  pull_request:
    branches: [main]
  schedule:
    - cron: '29 3 * * 1'
  workflow_dispatch:

concurrency:
  group: hounddog-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  hounddog:
    name: HoundDog privacy scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    container:
      image: hounddogai/hounddog
      options: --pull=always

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Advisory during the initial baseline review. Findings remain visible
      # in the log without blocking merges or requiring an API key.
      - name: Run HoundDog privacy scan
        continue-on-error: true
        run: hounddog scan --output-format=markdown --no-upload-scan-results
